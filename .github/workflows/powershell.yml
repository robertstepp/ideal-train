# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
#
# https://github.com/microsoft/action-psscriptanalyzer
# For more information on PSScriptAnalyzer in general, see
# https://github.com/PowerShell/PSScriptAnalyzer

name: PSScriptAnalyzer

on:
  push:
    branches: [ "main" ]
    # Archive/ holds retired versions that are never edited to fix lint.
    # A push touching only those files should not spend a CI run.
    # Note: paths-ignore applies to push and pull_request only -- the
    # scheduled run below is not filtered by it.
    paths-ignore:
      - 'Archive/**'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'Archive/**'
  schedule:
    - cron: '34 22 * * 5'

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run PSScriptAnalyzer
        uses: microsoft/psscriptanalyzer-action@6b2948b1944407914a58661c49941824d149734f
        with:
          # Options: https://github.com/microsoft/psscriptanalyzer-action
          # (the action-psscriptanalyzer URL in the original template 404s)
          # Root-level scripts only. 'path: .\' with recurse:true analysed the
          # whole tree including Archive/, which contributed 96 findings against
          # retired versions (chiefly PSUseSingularNouns and
          # PSUseShouldProcessForStateChangingFunctions, both fixed in the
          # current script). The wildcard also survives a version bump, so there
          # is no filename to update here when 5_13 becomes 5_14.
          # Forward slashes: this runs on ubuntu-latest, where PowerShell treats
          # a backslash as a literal character rather than a path separator.
          path: ./*.ps1
          recurse: false
          # No includeRule: the full default rule set runs (75 rules -- 8 Error,
          # 56 Warning, 11 Information). The sample config that shipped with this
          # workflow narrowed it to two security rules, neither of which can fire
          # on a script that uses no aliases and handles no credentials, so it
          # reported clean regardless of code quality.
          #
          # Rules deliberately silenced live with the code they apply to, as
          # SuppressMessageAttribute entries in the .ps1 with a stated
          # justification, rather than being switched off for the whole repo.
          #
          # Settings file supplies TargetVersions for PSUseCompatibleSyntax,
          # which is in the default rule set but silently does nothing until it
          # is told which PowerShell versions to check against. Targeting 5.1
          # and 7.0 makes PowerShell 7-only syntax (ternary, ??, &&/||) an Error,
          # since it is a parse failure under powershell.exe.
          #
          # The input takes a path, not a hashtable. Forward slashes again for
          # the ubuntu-latest runner.
          settings: ./PSScriptAnalyzerSettings.psd1
          output: results.sarif

      # Upload the SARIF file generated in the previous step
      - name: Upload SARIF results file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
